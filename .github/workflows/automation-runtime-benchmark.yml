name: Automation Runtime Benchmark

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "每个运行时的测量轮数"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    name: "Same Windows host: Python, .NET, WSL"
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      BENCHMARK_ROUNDS: ${{ inputs.rounds || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_electron.txt

      - name: Install Python Playwright
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install chromium

      - name: Benchmark Windows Python Playwright
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .arts/runtime-benchmark | Out-Null
          python tools/automation_runtime_benchmark/python_benchmark.py `
            --runtime windows-python `
            --rounds $env:BENCHMARK_ROUNDS `
            --fixture tools/automation_runtime_benchmark/fixture.html `
            --output .arts/runtime-benchmark/windows-python.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build .NET benchmark
        shell: pwsh
        run: dotnet build tools/automation_runtime_benchmark/dotnet/AutomationRuntimeBenchmark.csproj --configuration Release --nologo

      - name: Install .NET Playwright Chromium
        shell: pwsh
        run: pwsh tools/automation_runtime_benchmark/dotnet/bin/Release/net8.0/playwright.ps1 install chromium

      - name: Benchmark Windows .NET Playwright
        shell: pwsh
        run: |
          dotnet run --project tools/automation_runtime_benchmark/dotnet/AutomationRuntimeBenchmark.csproj `
            --configuration Release `
            --no-build `
            -- `
            --runtime windows-dotnet `
            --rounds $env:BENCHMARK_ROUNDS `
            --fixture (Resolve-Path tools/automation_runtime_benchmark/fixture.html).Path `
            --output (Resolve-Path .arts/runtime-benchmark).Path\windows-dotnet.json

      - name: Install Ubuntu on WSL
        uses: Ubuntu/WSL/.github/actions/wsl-install@main
        with:
          distro: Ubuntu-24.04

      - name: Benchmark WSL Ubuntu Playwright
        shell: pwsh
        run: |
          $repoWindows = (Resolve-Path .).Path
          $repoWsl = (wsl.exe -d Ubuntu-24.04 -- wslpath -a "$repoWindows").Trim()
          $script = @"
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv python3-pip
          rm -rf /tmp/wordtts-runtime-benchmark-venv
          python3 -m venv /tmp/wordtts-runtime-benchmark-venv
          . /tmp/wordtts-runtime-benchmark-venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
          cd '$repoWsl'
          mkdir -p .arts/runtime-benchmark
          python tools/automation_runtime_benchmark/python_benchmark.py \
            --runtime wsl-python \
            --rounds '$env:BENCHMARK_ROUNDS' \
            --fixture '$repoWsl/tools/automation_runtime_benchmark/fixture.html' \
            --output '$repoWsl/.arts/runtime-benchmark/wsl-python.json'
          "@
          wsl.exe -d Ubuntu-24.04 -- bash -lc $script

      - name: Summarize same-host results
        shell: pwsh
        run: |
          python tools/automation_runtime_benchmark/summarize.py `
            .arts/runtime-benchmark/windows-python.json `
            .arts/runtime-benchmark/windows-dotnet.json `
            .arts/runtime-benchmark/wsl-python.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-runtime-benchmark
          path: .arts/runtime-benchmark
          if-no-files-found: warn
