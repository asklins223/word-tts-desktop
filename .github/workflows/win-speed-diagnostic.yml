name: Windows speed diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_electron.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt
          python -m playwright install chromium

      - name: Run Windows browser diagnostic
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          DIAGNOSTIC_ROUNDS: "30"
        run: python tools/windows_speed_diagnostic.py

      - name: Run focused regression tests
        run: python -m unittest tests.test_textbook_page tests.test_platform_input tests.test_platform_input_batch_probe

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-speed-diagnostic
          path: |
            windows-speed-results.json
            windows-speed-trace.zip
          retention-days: 7
          if-no-files-found: warn
