# ============================================================================
# 小猪wordTTS — Windows 自动构建
# ============================================================================
# 在 Windows runner 上构建小猪wordTTS-Setup-x.x.x-x64.exe 自绘安装包
#
# 触发方式:
#   1. 手动触发 (Actions → Build Windows → Run workflow)
#   2. 由统一的 Build and Release workflow 调用进行 tag 构建
#
# 产物:
#   小猪wordTTS-Setup-<version>-x64.exe (HTML 自绘安装包)
#   小猪wordTTS-Setup-<version>-x64.exe.blockmap (自定义更新差分索引)
# ============================================================================

name: Build Windows

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 version.json 读取）'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: '版本号（留空则从 version.json 读取或使用 tag 版本）'
        required: false
        type: string
    outputs:
      version:
        description: '实际构建版本'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    # Release CI must never open a real external-provider session.
    env:
      WORDTTS_ENABLE_REAL_PROVIDER: '0'
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # ======================================================================
      # 1. 检出代码
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================================
      # 2. 安装 Python 3.11
      # ======================================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_electron.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\ms-playwright'
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('requirements_electron.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      # ======================================================================
      # 3. 安装 Node.js
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 项目 engines 固定要求 Node.js 24.x。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Cache electron-builder toolchains
        uses: actions/cache@v4
        with:
          # electron-builder downloads its installer toolchain and 7zip into
          # this cache. Keep the path explicit so both builder invocations in
          # the Windows build share the same cache on the ephemeral runner.
          path: ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-builder-

      - name: Resolve package version
        id: version
        shell: pwsh
        working-directory: electron
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.inputs.version || '' }}
        run: |
          $requested = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($requested) -and $env:GITHUB_REF_TYPE -eq "tag") {
            $requested = ($env:GITHUB_REF_NAME).TrimStart("v")
          }
          if (-not [string]::IsNullOrWhiteSpace($requested)) {
            node ..\scripts\project_version.js --set $requested
          } else {
            node ..\scripts\project_version.js --sync
          }
          $resolved = node ..\scripts\project_version.js
          "version=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "本次构建版本: $resolved"

      # ======================================================================
      # 4. 安装 Python 依赖
      # ======================================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt

      # ======================================================================
      # 5. 安装 Playwright Chromium（仅作为打包资源）
      # ======================================================================
      - name: Install Playwright browsers
        run: python -m playwright install chromium

      # ======================================================================
      # 6. 安装 Electron 依赖
      # ======================================================================
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --prefer-offline --no-audit --fund=false

      # ======================================================================
      # 7. PyInstaller 打包后端
      # ======================================================================
      - name: Build Python backend
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python -m PyInstaller server_pyinstaller.spec `
            --noconfirm `
            --distpath electron/server_backend_build `
            --workpath electron/server_backend_build_tmp
          node scripts/stage_playwright_browser.js electron/server_backend_build/server_backend

      # ======================================================================
      # 8. electron-builder 打包 Windows 应用
      # ======================================================================
      - name: Build app icons
        working-directory: electron
        run: npm run build:icons

      - name: Package Electron app directory
        working-directory: electron
        run: node ../scripts/build_protected_electron.js --win dir --publish never
        env:
          # 未配置密钥时生成未签名测试包；配置后自动生成 Authenticode 签名包。
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Build Windows portable installer
        working-directory: electron
        run: node ../scripts/build_windows_installer.js --payload release/win-unpacked --output-dir release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          # Keep the current self-drawing portable Setup route. The large app
          # payload is embedded as a lazy 7z resource, so the UI can appear
          # before application files are extracted; avoid BCJ2 because the
          # bundled 7za extractor must also unpack that resource.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          # electron-builder 26.15.x otherwise maps 7z "normal" to -mx=9.
          # Level 5 is substantially faster for the bundled Chromium payload.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'

      # ======================================================================
      # 8. 上传构建产物
      # ======================================================================
      - name: Find installer
        id: find-installer
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerName = "小猪wordTTS-Setup-$env:UPDATE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath (Join-Path "electron/release" $installerName) -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "未找到本次版本自绘安装包 $installerName；拒绝发布脱离 payload 目录后无法独立运行的 unpacked 可执行文件"
            exit 1
          }
          $blockmap = Get-Item -LiteralPath "$($installer.FullName).blockmap" -ErrorAction SilentlyContinue
          if (-not $blockmap -or $blockmap.Length -le 0) {
            Write-Error "未找到本次版本自绘安装包差分索引 $($installer.Name).blockmap"
            exit 1
          }
          Write-Host "找到安装包: $($installer.FullName)"
          Write-Host "大小: $([math]::Round($installer.Length / 1MB, 2)) MB"
          Write-Host "找到差分索引: $($blockmap.FullName)"
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          echo "blockmap_path=$($blockmap.FullName)" >> $env:GITHUB_OUTPUT
          echo "blockmap_name=$($blockmap.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows
          path: |
            ${{ steps.find-installer.outputs.installer_path }}
            ${{ steps.find-installer.outputs.blockmap_path }}
          retention-days: 30
          # Setup.exe already contains a compressed 7z payload.
          compression-level: 0
          if-no-files-found: error
