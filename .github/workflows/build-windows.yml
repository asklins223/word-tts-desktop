# ============================================================================
# 小猪wordTTS — Windows 自动构建
# ============================================================================
# 在 Windows runner 上构建小猪wordTTS-Setup-x.x.x-x64.exe 安装包
#
# 触发方式:
#   1. 手动触发 (Actions → Build Windows → Run workflow)
#   2. 由统一的 Build and Release workflow 调用进行 tag 构建
#
# 产物:
#   小猪wordTTS-Setup-<version>-x64.exe (NSIS 安装包)
# ============================================================================

name: Build Windows

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 package.json 读取）'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: '版本号（留空则从 package.json 读取或使用 tag 版本）'
        required: false
        type: string
    outputs:
      version:
        description: '实际构建版本'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # ======================================================================
      # 1. 检出代码
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================================
      # 2. 安装 Python 3.11
      # ======================================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_electron.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\ms-playwright'
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('requirements_electron.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      # ======================================================================
      # 3. 安装 Node.js
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 项目 engines 固定要求 Node.js 24.x。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Resolve package version
        id: version
        shell: pwsh
        working-directory: electron
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.inputs.version || '' }}
        run: |
          $requested = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($requested) -and $env:GITHUB_REF_TYPE -eq "tag") {
            $requested = ($env:GITHUB_REF_NAME).TrimStart("v")
          }
          if (-not [string]::IsNullOrWhiteSpace($requested)) {
            if ($requested -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
              Write-Error "非法版本号: $requested"
              exit 1
            }
            $current = node -p "require('./package.json').version"
            if ($requested -ne $current) {
              npm version $requested --no-git-tag-version
            } else {
              Write-Host "package.json 版本已是 $requested，跳过 npm version"
            }
          }
          $resolved = node -p "require('./package.json').version"
          "version=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "本次构建版本: $resolved"

      - name: Validate update policy
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/validate_update_policy.js

      # ======================================================================
      # 4. 安装 Python 依赖
      # ======================================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt

      # ======================================================================
      # 5. 安装 Playwright Chromium（仅作为打包资源；默认 smoke 不访问第三方页面）
      # ======================================================================
      - name: Install Playwright browsers
        run: python -m playwright install chromium

      # ======================================================================
      # 6. 安装 Electron 依赖
      # ======================================================================
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Test Electron native file dialogs
        working-directory: electron
        run: npm test

      - name: Check workflow contracts
        working-directory: electron
        run: npm run check:contracts

      - name: Run logical workflow smoke (no page/network)
        run: python tools/xunfei_smoke.py --logical-only --source "examples/documents/信息转述及询问信息 7上- U1.docx" --max-items 100

      - name: Audit packaged runtime dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      # ======================================================================
      # 7. PyInstaller 打包后端
      # ======================================================================
      - name: Build Python backend
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python -m PyInstaller server_pyinstaller.spec `
            --noconfirm `
            --distpath electron/server_backend_build `
            --workpath electron/server_backend_build_tmp
          node scripts/stage_playwright_browser.js electron/server_backend_build/server_backend

      - name: Verify backend artifact
        run: |
          if (-not (Test-Path "electron/server_backend_build/server_backend/server_backend.exe")) {
            Write-Error "PyInstaller 打包失败：未找到 server_backend.exe"
            exit 1
          }
          if (-not (Test-Path "electron/server_backend_build/server_backend/_internal/playwright_browsers/chromium-*")) {
            Write-Error "未找到内置 Playwright Chromium"
            exit 1
          }
          Write-Host "后端打包成功"
          Get-ChildItem -Path "electron/server_backend_build/server_backend" | Select-Object Name, Length | Format-Table

      - name: Smoke test packaged backend (local-only)
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $token = [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")
          $env:WORDTTS_PORT = "$port"
          $env:WORDTTS_API_TOKEN = $token
          $env:WORDTTS_VERSION = "${{ steps.version.outputs.version }}"
          $backend = Resolve-Path "electron/server_backend_build/server_backend/server_backend.exe"
          $process = Start-Process -FilePath $backend -WorkingDirectory (Split-Path $backend) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                Write-Error "后端提前退出，代码: $($process.ExitCode)"
                exit 1
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v1/health" -Headers @{"X-Desktop-Capability" = $token} -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.app -eq "wordtts" -and $health.version -eq "${{ steps.version.outputs.version }}") {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) {
              Write-Error "打包后端未通过健康检查"
              exit 1
            }
            Write-Host "打包后端启动冒烟测试通过"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      # ======================================================================
      # 7. electron-builder 打包 Windows 应用
      # ======================================================================
      - name: Build Electron app
        working-directory: electron
        run: |
          npm run build:icons
          npx electron-builder --win --publish never
        env:
          # 未配置密钥时生成未签名测试包；配置后自动生成 Authenticode 签名包。
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify unpacked desktop artifact (local-only)
        shell: pwsh
        env:
          # Keep the Electron smoke log in the uploadable runner temp folder.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          # 这里只验证打包文件存在；不启动页面，不登录讯飞，
          # 不访问第三方页面，不执行真实 Provider smoke。
          $exe = Resolve-Path "electron/release/win-unpacked/小猪wordTTS.exe"
          $backend = Resolve-Path "electron/release/win-unpacked/resources/server_backend/server_backend.exe"
          if (-not (Test-Path $exe)) { Write-Error "未找到 Electron 可执行文件"; exit 1 }
          if (-not (Test-Path $backend)) { Write-Error "未找到打包后端可执行文件"; exit 1 }
          Write-Host "Electron 与后端打包文件校验通过"
          & $backend --smoke-playwright
          if ($LASTEXITCODE -ne 0) {
            Write-Error "打包后端 Playwright/Chromium 冒烟失败"
            exit 1
          }
          Write-Host "打包后端 Playwright/Chromium 冒烟测试通过"
          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $smoke.WaitForExit(120000)) {
            Write-Error "Electron 桌面端到端冒烟测试超时"
            & taskkill.exe /PID $smoke.Id /T /F 2>$null | Out-Null
            exit 1
          }
          if ($smoke.ExitCode -ne 0) {
            Write-Error "Electron 桌面端到端冒烟测试失败，代码: $($smoke.ExitCode)"
            exit 1
          }
          Write-Host "Electron 桌面端到端冒烟测试通过"

      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows-smoke
          path: ${{ runner.temp }}/wordtts-electron-smoke.log
          retention-days: 7
          if-no-files-found: warn

      - name: Smoke test NSIS install, reinstall and uninstall
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerName = "小猪wordTTS-Setup-$env:UPDATE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath (Join-Path "electron/release" $installerName) -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "未找到本次版本的 NSIS 安装包: $installerName"
            exit 1
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP ("wordtts-installer-smoke-" + [guid]::NewGuid().ToString("N"))
          $installDir = Join-Path $smokeRoot "小猪wordTTS"
          $installerArgs = @("/S", "/D=$installDir")
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null

          function Invoke-CheckedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$Arguments = @(),
              [int]$TimeoutMs = 120000
            )

            $process = Start-Process `
              -FilePath $FilePath `
              -ArgumentList $Arguments `
              -WorkingDirectory (Split-Path -Parent $FilePath) `
              -PassThru
            try {
              if (-not $process.WaitForExit($TimeoutMs)) {
                & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
                throw "进程超时: $FilePath"
              }
              if ($process.ExitCode -ne 0) {
                throw "进程失败，代码 $($process.ExitCode): $FilePath"
              }
            } finally {
              if (-not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              }
            }
          }

          try {
            Write-Host "执行 NSIS 全新安装: $($installer.FullName)"
            Invoke-CheckedProcess -FilePath $installer.FullName -Arguments $installerArgs

            $appExe = Get-ChildItem -Path $smokeRoot -Filter "小猪wordTTS.exe" -File -Recurse |
              Select-Object -First 1
            if (-not $appExe) {
              throw "安装完成后未找到小猪wordTTS.exe"
            }
            Write-Host "安装文件校验通过: $($appExe.FullName)"

            $uninstaller = Get-ChildItem -Path $smokeRoot -Filter "Uninstall *.exe" -File -Recurse |
              Select-Object -First 1
            if (-not $uninstaller) {
              throw "安装完成后未找到卸载程序"
            }

            Invoke-CheckedProcess -FilePath $appExe.FullName -Arguments @("--smoke-test")
            Write-Host "已安装应用启动冒烟测试通过"

            Write-Host "执行同版本覆盖安装，验证重装路径"
            Invoke-CheckedProcess -FilePath $installer.FullName -Arguments $installerArgs
            if (-not (Test-Path -LiteralPath $appExe.FullName)) {
              throw "覆盖安装后应用文件丢失"
            }

            Write-Host "执行静默卸载"
            Invoke-CheckedProcess -FilePath $uninstaller.FullName -Arguments @("/S")
            # NSIS performs the final self-delete from a short-lived helper
            # process after the uninstaller process returns.  Give that
            # cleanup a bounded settling window before asserting the result;
            # an immediate Test-Path check races the helper on Windows.
            $uninstallDeadline = (Get-Date).AddSeconds(30)
            while ((Test-Path -LiteralPath $appExe.FullName) -and (Get-Date) -lt $uninstallDeadline) {
              Start-Sleep -Milliseconds 500
            }
            if (Test-Path -LiteralPath $appExe.FullName) {
              throw "卸载完成后应用文件仍存在: $($appExe.FullName)"
            }
            Write-Host "NSIS 安装、重装、卸载生命周期测试通过"
          } finally {
            if (Test-Path -LiteralPath $smokeRoot) {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      # ======================================================================
      # 8. 上传构建产物
      # ======================================================================
      - name: Find installer
        id: find-installer
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerName = "小猪wordTTS-Setup-$env:UPDATE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath (Join-Path "electron/release" $installerName) -ErrorAction SilentlyContinue
          if ($installer) {
            Write-Host "找到安装包: $($installer.FullName)"
            Write-Host "大小: $([math]::Round($installer.Length / 1MB, 2)) MB"
            $blockmapPath = "$($installer.FullName).blockmap"
            $blockmap = Get-Item -LiteralPath $blockmapPath -ErrorAction SilentlyContinue
            if (-not $blockmap -or $blockmap.Length -le 0) {
              Write-Error "未找到当前版本 blockmap: $blockmapPath"
              exit 1
            }
            echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
            echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
            echo "blockmap_path=$($blockmap.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "未找到本次版本 NSIS 安装包 $installerName；拒绝发布脱离 resources 目录后无法独立运行的 unpacked 可执行文件"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows
          path: |
            ${{ steps.find-installer.outputs.installer_path }}
            ${{ steps.find-installer.outputs.blockmap_path }}
          retention-days: 30
          if-no-files-found: error
