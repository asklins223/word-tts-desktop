# ============================================================================
# 小猪wordTTS — Windows 自动构建
# ============================================================================
# 在 Windows runner 上构建小猪wordTTS-Setup-x.x.x-x64.exe 自绘安装包
#
# 触发方式:
#   1. 手动触发 (Actions → Build Windows → Run workflow)
#   2. 由统一的 Build and Release workflow 调用进行 tag 构建
#
# 产物:
#   小猪wordTTS-Setup-<version>-x64.exe (HTML 自绘安装包)
# ============================================================================

name: Build Windows

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 version.json 读取）'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: '版本号（留空则从 version.json 读取或使用 tag 版本）'
        required: false
        type: string
    outputs:
      version:
        description: '实际构建版本'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # ======================================================================
      # 1. 检出代码
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================================
      # 2. 安装 Python 3.11
      # ======================================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_electron.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: '~\AppData\Local\ms-playwright'
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('requirements_electron.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      # ======================================================================
      # 3. 安装 Node.js
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 项目 engines 固定要求 Node.js 24.x。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Cache electron-builder toolchains
        uses: actions/cache@v4
        with:
          # electron-builder downloads its installer toolchain and 7zip into
          # this cache. Keep the path explicit so both builder invocations in
          # the Windows build share the same cache on the ephemeral runner.
          path: ${{ runner.temp }}/electron-builder-cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-builder-${{ hashFiles('electron/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-builder-

      - name: Resolve package version
        id: version
        shell: pwsh
        working-directory: electron
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.inputs.version || '' }}
        run: |
          $requested = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($requested) -and $env:GITHUB_REF_TYPE -eq "tag") {
            $requested = ($env:GITHUB_REF_NAME).TrimStart("v")
          }
          if (-not [string]::IsNullOrWhiteSpace($requested)) {
            node ..\scripts\project_version.js --set $requested
          } else {
            node ..\scripts\project_version.js --sync
          }
          $resolved = node ..\scripts\project_version.js
          "version=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "本次构建版本: $resolved"

      - name: Validate update policy
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/validate_update_policy.js

      # ======================================================================
      # 4. 安装 Python 依赖
      # ======================================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt

      # ======================================================================
      # 5. 安装 Playwright Chromium（仅作为打包资源；默认 smoke 不访问第三方页面）
      # ======================================================================
      - name: Install Playwright browsers
        run: python -m playwright install chromium

      # ======================================================================
      # 6. 安装 Electron 依赖
      # ======================================================================
      - name: Install Electron dependencies
        working-directory: electron
        # A dedicated audit step runs below; avoid npm ci doing the same
        # registry audit a second time while installing from the cache.
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Test Electron native file dialogs
        working-directory: electron
        run: npm test

      - name: Check workflow contracts
        working-directory: electron
        run: npm run check:contracts

      - name: Run logical workflow smoke (no page/network)
        run: python tools/xunfei_smoke.py --logical-only --source "examples/documents/信息转述及询问信息 7上- U1.docx" --max-items 100

      - name: Audit packaged runtime dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      # ======================================================================
      # 7. PyInstaller 打包后端
      # ======================================================================
      - name: Build Python backend
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python -m PyInstaller server_pyinstaller.spec `
            --noconfirm `
            --distpath electron/server_backend_build `
            --workpath electron/server_backend_build_tmp
          node scripts/stage_playwright_browser.js electron/server_backend_build/server_backend

      - name: Verify backend artifact
        run: |
          if (-not (Test-Path "electron/server_backend_build/server_backend/server_backend.exe")) {
            Write-Error "PyInstaller 打包失败：未找到 server_backend.exe"
            exit 1
          }
          if (-not (Test-Path "electron/server_backend_build/server_backend/_internal/playwright_browsers/chromium-*")) {
            Write-Error "未找到内置 Playwright Chromium"
            exit 1
          }
          Write-Host "后端打包成功"
          Get-ChildItem -Path "electron/server_backend_build/server_backend" | Select-Object Name, Length | Format-Table

      - name: Smoke test packaged backend (local-only)
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $token = [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")
          $env:WORDTTS_PORT = "$port"
          $env:WORDTTS_API_TOKEN = $token
          $env:WORDTTS_VERSION = "${{ steps.version.outputs.version }}"
          $backend = Resolve-Path "electron/server_backend_build/server_backend/server_backend.exe"
          $process = Start-Process -FilePath $backend -WorkingDirectory (Split-Path $backend) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                Write-Error "后端提前退出，代码: $($process.ExitCode)"
                exit 1
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/v1/health" -Headers @{"X-Desktop-Capability" = $token} -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.app -eq "wordtts" -and $health.version -eq "${{ steps.version.outputs.version }}") {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) {
              Write-Error "打包后端未通过健康检查"
              exit 1
            }
            Write-Host "打包后端启动冒烟测试通过"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      # ======================================================================
      # 7. electron-builder 打包 Windows 应用
      # ======================================================================
      - name: Build app icons
        working-directory: electron
        run: npm run build:icons

      - name: Package Electron app directory
        working-directory: electron
        run: npx electron-builder --win dir --publish never
        env:
          # 未配置密钥时生成未签名测试包；配置后自动生成 Authenticode 签名包。
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache

      - name: Build Windows portable installer
        working-directory: electron
        run: node ../scripts/build_windows_installer.js --payload release/win-unpacked --output-dir release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          # Keep the portable payload in 7z, but avoid BCJ2: the bundled
          # NSIS 7z extractor must also unpack it during install/update.
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          # electron-builder 26.15.x otherwise maps 7z "normal" to -mx=9.
          # Level 5 is substantially faster for the bundled Chromium payload.
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'

      - name: Verify unpacked desktop artifact (local-only)
        shell: pwsh
        env:
          # Keep the Electron smoke log in the uploadable runner temp folder.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          # 这里只验证打包文件存在；不启动页面，不登录讯飞，
          # 不访问第三方页面，不执行真实 Provider smoke。
          $exe = Resolve-Path "electron/release/win-unpacked/小猪wordTTS.exe"
          $backend = Resolve-Path "electron/release/win-unpacked/resources/server_backend/server_backend.exe"
          if (-not (Test-Path $exe)) { Write-Error "未找到 Electron 可执行文件"; exit 1 }
          if (-not (Test-Path $backend)) { Write-Error "未找到打包后端可执行文件"; exit 1 }
          Write-Host "Electron 与后端打包文件校验通过"
          & $backend --smoke-playwright
          if ($LASTEXITCODE -ne 0) {
            Write-Error "打包后端 Playwright/Chromium 冒烟失败"
            exit 1
          }
          Write-Host "打包后端 Playwright/Chromium 冒烟测试通过"
          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $smoke.WaitForExit(120000)) {
            Write-Error "Electron 桌面端到端冒烟测试超时"
            & taskkill.exe /PID $smoke.Id /T /F 2>$null | Out-Null
            exit 1
          }
          if ($smoke.ExitCode -ne 0) {
            Write-Error "Electron 桌面端到端冒烟测试失败，代码: $($smoke.ExitCode)"
            exit 1
          }
          Write-Host "Electron 桌面端到端冒烟测试通过"

      - name: Smoke test persistent Chromium (Windows)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          # 真正的讯飞流程使用 headless:false 的持久化上下文，此前 CI 仅测
          # headless:true 的单次 launch，导致打包缺件仍能通过。
          $browsersCandidates = @(
            "electron/release/win-unpacked/resources/server_backend/_internal/playwright_browsers",
            "electron/release/win-unpacked/resources/server_backend/playwright_browsers"
          )
          $browsers = $null
          foreach ($cand in $browsersCandidates) {
            if (Test-Path $cand) { $browsers = (Resolve-Path $cand).Path; break }
          }
          if (-not $browsers) { Write-Error "未找到打包内的 playwright_browsers 目录"; exit 1 }
          $electron = (Resolve-Path "electron/release/win-unpacked/小猪wordTTS.exe").Path
          $env:PLAYWRIGHT_BROWSERS_PATH = $browsers
          $env:PLAYWRIGHT_NODEJS_PATH = $electron
          $env:ELECTRON_RUN_AS_NODE = "1"
          Write-Host "使用 Chromium 目录: $browsers"
          Write-Host "使用 Node (Electron): $electron"
          # 使用临时 profile 启动持久化上下文，headless:true 避免 runner 无显示问题
          $pyCode = @'
          from playwright.sync_api import sync_playwright
          import tempfile, shutil, os
          tmp = tempfile.mkdtemp(prefix='pw-persistent-smoke-')
          print(f'临时 profile: {tmp}')
          p = sync_playwright().start()
          try:
              ctx = p.chromium.launch_persistent_context(
                  tmp,
                  channel='chromium',
                  headless=True,
                  args=['--no-first-run','--no-default-browser-check','--disable-background-networking'],
              )
              page = ctx.new_page()
              page.goto('about:blank')
              print('persistent context ok')
              ctx.close()
          finally:
              p.stop()
              shutil.rmtree(tmp, ignore_errors=True)
          print('Playwright 持久化上下文冒烟通过')
          '@
          $pyFile = Join-Path $env:TEMP "pw-persistent-smoke.py"
          Set-Content -Path $pyFile -Value $pyCode -Encoding utf8
          python $pyFile
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Playwright 持久化上下文冒烟失败"
            exit 1
          }
          Write-Host "Playwright 持久化上下文冒烟通过"

      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows-smoke
          path: ${{ runner.temp }}/wordtts-electron-smoke.log
          retention-days: 7
          if-no-files-found: warn

      - name: Smoke test custom install, update and uninstall
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          # Keep deferred-uninstall diagnostics in the same runner temp
          # directory that the upload step collects. This also makes the
          # portable setup's temporary handoff location deterministic.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $installerName = "小猪wordTTS-Setup-$env:UPDATE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath (Join-Path "electron/release" $installerName) -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "未找到本次版本的自绘安装包: $installerName"
            exit 1
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP ("wordtts-installer-smoke-" + [guid]::NewGuid().ToString("N"))
          $installDir = Join-Path $smokeRoot "小猪wordTTS"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null

          function Invoke-CheckedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$Arguments = @(),
              [int]$TimeoutMs = 120000,
              [string]$WorkingDirectory = $null
            )

            $logBase = Join-Path $env:RUNNER_TEMP ("wordtts-installer-" + [guid]::NewGuid().ToString("N"))
            $stdoutPath = "$logBase.stdout.log"
            $stderrPath = "$logBase.stderr.log"
            $diagnosticPath = "$logBase.log"
            $script:LastInstallerDiagnosticPath = $diagnosticPath
            $previousDiagnosticPath = $env:WORDTTS_INSTALLER_LOG
            $env:WORDTTS_INSTALLER_LOG = $diagnosticPath
            $process = $null
            try {
              # Never keep the uninstaller's own install directory as the
              # working directory while the deferred cleanup tries to delete it.
              # A Windows process holds a handle on its CWD, so a CWD inside the
              # target would make the final rmdir permanently fail.
              $effectiveWorkDir = $WorkingDirectory
              if (-not $effectiveWorkDir) {
                $candidate = Split-Path -Parent $FilePath
                # If the executable lives inside the smoke-test target, run from
                # the runner temp instead of the target itself.
                if ($candidate -and $installDir -and ($candidate -eq $installDir -or $candidate.StartsWith($installDir + "\", [System.StringComparison]::OrdinalIgnoreCase))) {
                  $effectiveWorkDir = $env:RUNNER_TEMP
                } else {
                  $effectiveWorkDir = $candidate
                }
              }
              if (-not $effectiveWorkDir -or -not (Test-Path -LiteralPath $effectiveWorkDir)) {
                $effectiveWorkDir = $env:RUNNER_TEMP
              }
              $process = Start-Process `
                -FilePath $FilePath `
                -ArgumentList $Arguments `
                -WorkingDirectory $effectiveWorkDir `
                -RedirectStandardOutput $stdoutPath `
                -RedirectStandardError $stderrPath `
                -WindowStyle Hidden `
                -PassThru
              if (-not $process.WaitForExit($TimeoutMs)) {
                & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
                throw "进程超时: $FilePath"
              }
              if ($process.ExitCode -ne 0) {
                Write-Host "安装器诊断: $diagnosticPath"
                if (Test-Path -LiteralPath $diagnosticPath) { Get-Content -LiteralPath $diagnosticPath -Raw -ErrorAction SilentlyContinue }
                Write-Host "进程 stdout: $stdoutPath"
                if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath -Raw -ErrorAction SilentlyContinue }
                Write-Host "进程 stderr: $stderrPath"
                if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath -Raw -ErrorAction SilentlyContinue }
                throw "进程失败，代码 $($process.ExitCode): $FilePath"
              }
            } finally {
              if ($process -and -not $process.HasExited) {
                & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              }
              if ($null -eq $previousDiagnosticPath) {
                Remove-Item Env:WORDTTS_INSTALLER_LOG -ErrorAction SilentlyContinue
              } else {
                $env:WORDTTS_INSTALLER_LOG = $previousDiagnosticPath
              }
            }
          }

          try {
            Write-Host "执行自绘全新安装: $($installer.FullName)"
            Invoke-CheckedProcess -FilePath $installer.FullName -Arguments @("--headless", "--mode=install", "--target", $installDir)

            $appExe = Join-Path $installDir "小猪wordTTS.exe"
            if (-not (Test-Path -LiteralPath $appExe)) { throw "安装完成后未找到小猪wordTTS.exe" }
            Write-Host "安装文件校验通过: $appExe"

            $uninstaller = Join-Path $installDir "小猪wordTTS-uninstaller.exe"
            if (-not (Test-Path -LiteralPath $uninstaller)) { throw "安装完成后未找到自绘卸载程序" }

            Invoke-CheckedProcess -FilePath $appExe -Arguments @("--smoke-test")
            Write-Host "已安装应用启动冒烟测试通过"

            Write-Host "验证已安装后端的持久化 Chromium..."
            $installedBackend = Join-Path $installDir "resources/server_backend/server_backend.exe"
            $installedBrowsersCandidates = @(
              (Join-Path $installDir "resources/server_backend/_internal/playwright_browsers"),
              (Join-Path $installDir "resources/server_backend/playwright_browsers")
            )
            $installedBrowsers = $null
            foreach ($cand in $installedBrowsersCandidates) {
              if (Test-Path $cand) { $installedBrowsers = $cand; break }
            }
            if (-not $installedBrowsers) { throw "已安装应用内未找到 playwright_browsers" }
            $env:PLAYWRIGHT_BROWSERS_PATH = $installedBrowsers
            $env:PLAYWRIGHT_NODEJS_PATH = $appExe
            $env:ELECTRON_RUN_AS_NODE = "1"
            $pyCode2 = @'
          from playwright.sync_api import sync_playwright
          import tempfile, shutil
          tmp = tempfile.mkdtemp(prefix='pw-installed-smoke-')
          p = sync_playwright().start()
          try:
              ctx = p.chromium.launch_persistent_context(tmp, channel='chromium', headless=True, args=['--no-first-run'])
              page = ctx.new_page()
              page.goto('about:blank')
              print('installed persistent ok')
              ctx.close()
          finally:
              p.stop()
              shutil.rmtree(tmp, ignore_errors=True)
          '@
            $pyFile2 = Join-Path $env:TEMP "pw-installed-smoke.py"
            Set-Content -Path $pyFile2 -Value $pyCode2 -Encoding utf8
            python $pyFile2
            if ($LASTEXITCODE -ne 0) { throw "已安装后端的持久化 Chromium 冒烟失败" }
            Write-Host "已安装后端的持久化 Chromium 冒烟通过"

            # The installed-backend check runs Electron in Node mode. Do not
            # leak that mode or its paths into the next Setup.exe invocation:
            # otherwise the updater itself is started as a Node process and
            # exits before installer-main.js can write a diagnostic.
            Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
            Remove-Item Env:PLAYWRIGHT_BROWSERS_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:PLAYWRIGHT_NODEJS_PATH -ErrorAction SilentlyContinue

            # The installer intentionally rejects same-version updates. Mark
            # this disposable smoke-test installation as an older release so
            # the next invocation exercises the real upgrade path instead of
            # testing an invalid downgrade/same-version request.
            $statePath = Join-Path $installDir "install-state.json"
            $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            $state.version = "0.0.0"
            $state | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $statePath -Encoding utf8
            Write-Host "已将冒烟安装状态标记为旧版本 0.0.0，开始验证升级替换路径"

            Write-Host "执行自绘更新，验证覆盖替换路径"
            Invoke-CheckedProcess -FilePath $installer.FullName -Arguments @("--headless", "--mode=update", "--target", $installDir)
            if (-not (Test-Path -LiteralPath $appExe)) { throw "更新完成后应用文件丢失" }
            $updatedState = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if ($updatedState.version -ne $env:UPDATE_VERSION) { throw "更新完成后安装状态版本错误: $($updatedState.version)" }

            Write-Host "执行自绘卸载"
            $uninstallStartedAt = Get-Date
            Invoke-CheckedProcess -FilePath $uninstaller -Arguments @("--headless", "--mode=uninstall", "--target", $installDir) -WorkingDirectory $env:RUNNER_TEMP
            $uninstallDiagnosticPath = $script:LastInstallerDiagnosticPath
            # 源 uninstaller 只负责把执行权交给 TEMP 副本，因此它返回时
            # 真正的卸载仍可能在进行。这里只观察产品自己的同步目录删除
            # 和 TEMP 外壳自清理结果，不在 CI 中代替产品删除任何文件。
            $uninstallDeadline = (Get-Date).AddSeconds(180)
            $lastPollLog = Get-Date
            while ((Test-Path -LiteralPath $installDir) -and (Get-Date) -lt $uninstallDeadline) {
              Start-Sleep -Milliseconds 500
              if ((Get-Date) -gt $lastPollLog.AddSeconds(10)) {
                $lastPollLog = Get-Date
                try {
                  $remaining = (Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object).Count
                  Write-Host "卸载轮询中：目标仍存在，剩余文件数约 $remaining"
                } catch { Write-Host "卸载轮询中：目标仍存在" }
              }
            }
            if (Test-Path -LiteralPath $installDir) {
              Write-Host "卸载后目录仍存在，输出诊断信息"
              $residualLog = Join-Path $env:RUNNER_TEMP ("wordtts-installer-residual-" + [guid]::NewGuid().ToString("N") + ".log")
              try {
                "installDir=$installDir" | Set-Content -LiteralPath $residualLog -Encoding utf8
                "--- remaining files ---" | Add-Content -LiteralPath $residualLog -Encoding utf8
                Get-ChildItem -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue |
                  Select-Object FullName, Length, Attributes, LastWriteTimeUtc |
                  Format-List | Out-String | Add-Content -LiteralPath $residualLog -Encoding utf8
                "--- related processes ---" | Add-Content -LiteralPath $residualLog -Encoding utf8
                Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                  Where-Object { ([string]$_.ExecutablePath).StartsWith($installDir, [System.StringComparison]::OrdinalIgnoreCase) -or ([string]$_.CommandLine).Contains($installDir) } |
                  Select-Object ProcessId, ParentProcessId, Name, ExecutablePath, CommandLine |
                  Format-List | Out-String | Add-Content -LiteralPath $residualLog -Encoding utf8
                Get-Content -LiteralPath $residualLog -Raw | Write-Host
              } catch { Write-Host "无法生成残留诊断: $_" }
              $diagLogs = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "wordtts-uninstall*.log" -ErrorAction SilentlyContinue
              foreach ($log in $diagLogs) {
                Write-Host "卸载清理日志: $($log.FullName)"
                try { Get-Content -LiteralPath $log.FullName -Raw -ErrorAction SilentlyContinue | Write-Host } catch {}
              }
              $installerLogs = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "wordtts-installer-*.log" -ErrorAction SilentlyContinue
              foreach ($log in $installerLogs) {
                Write-Host "安装器日志: $($log.FullName)"
                try { Get-Content -LiteralPath $log.FullName -Raw -ErrorAction SilentlyContinue | Write-Host } catch {}
              }
              throw "卸载完成后安装目录仍存在: $installDir"
            }

            # The source NSIS wrapper returns after handing off to the staged
            # TEMP wrapper. Directory absence alone is therefore insufficient:
            # require the staged Electron operation itself to report a clean
            # handoff and completion, and reject any hidden asynchronous error.
            $uninstallDiagnosticDeadline = (Get-Date).AddSeconds(60)
            $uninstallDiagnosticComplete = $false
            $uninstallDiagnostic = ""
            while ((Get-Date) -lt $uninstallDiagnosticDeadline) {
              if ($uninstallDiagnosticPath -and (Test-Path -LiteralPath $uninstallDiagnosticPath)) {
                $uninstallDiagnostic = [string](Get-Content -LiteralPath $uninstallDiagnosticPath -Raw -ErrorAction SilentlyContinue)
                if ($uninstallDiagnostic -match '\[error\]') {
                  throw "迁移后的卸载器内部报错:`n$uninstallDiagnostic"
                }
                if ($uninstallDiagnostic.Contains("[handoff] NSIS relocated uninstaller active") -and
                    $uninstallDiagnostic.Contains("[handoff] source uninstaller wrapper exited") -and
                    $uninstallDiagnostic.Contains("[complete] installer operation succeeded")) {
                  $uninstallDiagnosticComplete = $true
                  break
                }
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $uninstallDiagnosticComplete) {
              throw "迁移后的卸载器没有报告完整成功状态: $uninstallDiagnosticPath`n$uninstallDiagnostic"
            }

            # The staged portable wrapper is deliberately outside the install
            # target. Its dedicated helper must remove that TEMP executable
            # after Electron and NSIS both exit; otherwise every uninstall
            # would leak a large setup binary.
            $stageCleanupDeadline = (Get-Date).AddSeconds(120)
            $stageCleanupComplete = $false
            $stageCleanupDiagnostic = ""
            while ((Get-Date) -lt $stageCleanupDeadline) {
              $startupFailures = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "wordtts-uninstaller-stage-*.cleanup.cmd.startup.log" -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -ge $uninstallStartedAt.AddSeconds(-2) }
              if ($startupFailures) {
                $startupDiagnostic = ($startupFailures | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue }) -join "`n"
                throw "TEMP 卸载外壳清理进程启动失败:`n$startupDiagnostic"
              }
              $stageLogs = Get-ChildItem -Path $env:RUNNER_TEMP -Filter "wordtts-uninstaller-stage-*.cleanup.cmd.log" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -notlike "*.startup.log" -and $_.LastWriteTime -ge $uninstallStartedAt.AddSeconds(-2) }
              $stageCleanupDiagnostic = ($stageLogs | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue }) -join "`n"
              if ($stageCleanupDiagnostic -match "staged cleanup (failed|crashed)") {
                throw "TEMP 卸载外壳未能自清理:`n$stageCleanupDiagnostic"
              }
              if ($stageCleanupDiagnostic -match "staged cleanup complete") {
                $stageCleanupComplete = $true
                break
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not $stageCleanupComplete) {
              throw "TEMP 卸载外壳没有在限定时间内完成自清理:`n$stageCleanupDiagnostic"
            }
            Write-Host "自绘安装、更新、卸载生命周期测试通过"
          } finally {
            if (Test-Path -LiteralPath $smokeRoot) {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload installer lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows-installer-smoke
          path: |
            ${{ runner.temp }}/wordtts-installer-*.log
            ${{ runner.temp }}/wordtts-uninstall*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload failed installer for forensic inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows-failed-installer
          path: electron/release/小猪wordTTS-Setup-*-x64.exe
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn

      # ======================================================================
      # 8. 上传构建产物
      # ======================================================================
      - name: Find installer
        id: find-installer
        shell: pwsh
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installerName = "小猪wordTTS-Setup-$env:UPDATE_VERSION-x64.exe"
          $installer = Get-Item -LiteralPath (Join-Path "electron/release" $installerName) -ErrorAction SilentlyContinue
          if ($installer) {
            Write-Host "找到安装包: $($installer.FullName)"
            Write-Host "大小: $([math]::Round($installer.Length / 1MB, 2)) MB"
            echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
            echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "未找到本次版本自绘安装包 $installerName；拒绝发布脱离 payload 目录后无法独立运行的 unpacked 可执行文件"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows
          path: |
            ${{ steps.find-installer.outputs.installer_path }}
          retention-days: 30
          # Setup.exe already contains a compressed 7z payload.
          compression-level: 0
          if-no-files-found: error
