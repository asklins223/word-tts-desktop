# ============================================================================
# 小猪wordTTS — Windows 自动构建
# ============================================================================
# 在 Windows runner 上构建小猪wordTTS-Setup-x.x.x-x64.exe 安装包
#
# 触发方式:
#   1. 手动触发 (Actions → Build Windows → Run workflow)
#   2. 推送 tag v* 时自动触发
#
# 产物:
#   小猪wordTTS-Setup-<version>-x64.exe (NSIS 安装包)
# ============================================================================

name: Build Windows

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 package.json 读取）'
        required: false
        default: ''

  # 推送 tag 时自动触发
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # ======================================================================
      # 1. 检出代码
      # ======================================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================================
      # 2. 安装 Python 3.11
      # ======================================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_electron.txt

      # ======================================================================
      # 3. 安装 Node.js
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Electron 43 的构建工具要求 Node >= 22.12。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Resolve package version
        id: version
        shell: pwsh
        working-directory: electron
        run: |
          $requested = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($requested) -and "${{ github.ref_type }}" -eq "tag") {
            $requested = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not [string]::IsNullOrWhiteSpace($requested)) {
            if ($requested -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
              Write-Error "非法版本号: $requested"
              exit 1
            }
            $current = node -p "require('./package.json').version"
            if ($requested -ne $current) {
              npm version $requested --no-git-tag-version
            } else {
              Write-Host "package.json 版本已是 $requested，跳过 npm version"
            }
          }
          $resolved = node -p "require('./package.json').version"
          "version=$resolved" >> $env:GITHUB_OUTPUT
          Write-Host "本次构建版本: $resolved"

      # ======================================================================
      # 4. 安装 Python 依赖
      # ======================================================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt

      # ======================================================================
      # 5. 安装 Playwright Chromium 浏览器（讯飞配音浏览器自动化需要）
      # ======================================================================
      - name: Install Playwright browsers
        run: python -m playwright install chromium

      # ======================================================================
      # 6. 安装 Electron 依赖
      # ======================================================================
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Test Electron native file dialogs
        working-directory: electron
        run: npm test

      - name: Audit packaged runtime dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      # ======================================================================
      # 7. PyInstaller 打包后端
      # ======================================================================
      - name: Build Python backend
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          python -m PyInstaller server_pyinstaller.spec `
            --noconfirm `
            --distpath electron/server_backend_build `
            --workpath electron/server_backend_build_tmp
          node scripts/stage_playwright_browser.js electron/server_backend_build/server_backend

      - name: Verify backend artifact
        run: |
          if (-not (Test-Path "electron/server_backend_build/server_backend/server_backend.exe")) {
            Write-Error "PyInstaller 打包失败：未找到 server_backend.exe"
            exit 1
          }
          if (-not (Test-Path "electron/server_backend_build/server_backend/_internal/playwright_browsers/chromium-*")) {
            Write-Error "未找到内置 Playwright Chromium"
            exit 1
          }
          Write-Host "后端打包成功"
          Get-ChildItem -Path "electron/server_backend_build/server_backend" | Select-Object Name, Length | Format-Table

      - name: Smoke test packaged backend
        shell: pwsh
        run: |
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $token = [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")
          $env:WORDTTS_PORT = "$port"
          $env:WORDTTS_API_TOKEN = $token
          $env:WORDTTS_VERSION = "${{ steps.version.outputs.version }}"
          $backend = Resolve-Path "electron/server_backend_build/server_backend/server_backend.exe"
          $process = Start-Process -FilePath $backend -WorkingDirectory (Split-Path $backend) -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 180; $attempt++) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                Write-Error "后端提前退出，代码: $($process.ExitCode)"
                exit 1
              }
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -Headers @{"X-WordTTS-Token" = $token} -TimeoutSec 2
                if ($health.status -eq "ok" -and $health.app -eq "wordtts" -and $health.version -eq "${{ steps.version.outputs.version }}") {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) {
              Write-Error "打包后端未通过健康检查"
              exit 1
            }
            Write-Host "打包后端启动冒烟测试通过"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      # ======================================================================
      # 7. electron-builder 打包 Windows 应用
      # ======================================================================
      - name: Build Electron app
        working-directory: electron
        run: |
          npm run build:icons
          npx electron-builder --win --publish never
        env:
          # 未配置密钥时生成未签名测试包；配置后自动生成 Authenticode 签名包。
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Smoke test unpacked desktop app
        shell: pwsh
        run: |
          $exe = Resolve-Path "electron/release/win-unpacked/小猪wordTTS.exe"
          $backend = Resolve-Path "electron/release/win-unpacked/resources/server_backend/server_backend.exe"
          $previousNodePath = $env:PLAYWRIGHT_NODEJS_PATH
          $previousElectronNodeMode = $env:ELECTRON_RUN_AS_NODE
          try {
            $env:PLAYWRIGHT_NODEJS_PATH = "$exe"
            $env:ELECTRON_RUN_AS_NODE = "1"
            & $backend --smoke-playwright
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Playwright/Chromium 打包冒烟测试失败，代码: $LASTEXITCODE"
              exit 1
            }
          } finally {
            $env:PLAYWRIGHT_NODEJS_PATH = $previousNodePath
            $env:ELECTRON_RUN_AS_NODE = $previousElectronNodeMode
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -WorkingDirectory (Split-Path $exe) -PassThru
          if (-not $process.WaitForExit(120000)) {
            Write-Warning "Electron 桌面端到端冒烟测试超时，输出应用诊断日志"
            $smokeLog = Join-Path $env:TEMP "wordtts-electron-smoke.log"
            if (Test-Path $smokeLog) {
              Get-Content $smokeLog -Tail 120
            } else {
              Write-Warning "未找到 Electron 冒烟诊断日志: $smokeLog"
            }
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            Write-Error "Electron 桌面端到端冒烟测试超时"
            exit 1
          }
          if ($process.ExitCode -ne 0) {
            Write-Warning "Electron 桌面端到端冒烟测试失败，输出应用诊断日志"
            $smokeLog = Join-Path $env:TEMP "wordtts-electron-smoke.log"
            if (Test-Path $smokeLog) {
              Get-Content $smokeLog -Tail 160
            } else {
              Write-Warning "未找到 Electron 冒烟诊断日志: $smokeLog"
            }
            Write-Error "Electron 桌面端到端冒烟测试失败，代码: $($process.ExitCode)"
            exit 1
          }
          Write-Host "Electron 桌面界面端到端冒烟测试通过"

      # ======================================================================
      # 8. 上传构建产物
      # ======================================================================
      - name: Find installer
        id: find-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "electron/release" -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'unpacked' } | Select-Object -First 1
          if ($installer) {
            Write-Host "找到安装包: $($installer.FullName)"
            Write-Host "大小: $([math]::Round($installer.Length / 1MB, 2)) MB"
            echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
            echo "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "未找到 NSIS 安装包；拒绝发布脱离 resources 目录后无法独立运行的 unpacked 可执行文件"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-Windows
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
          retention-days: 30
          if-no-files-found: error

      # ======================================================================
      # 9. （tag 触发）发布 GitHub Release
      # ======================================================================
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find-installer.outputs.installer_path }}
            electron/release/*.blockmap
          name: 小猪wordTTS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
