name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 version.json 读取）'
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: '版本号（留空则从 version.json 读取或使用 tag 版本）'
        required: false
        type: string
    outputs:
      version:
        description: '实际构建版本'
        value: ${{ jobs.build.outputs.version }}
      architecture:
        description: '实际构建架构'
        value: ${{ jobs.build.outputs.architecture }}

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    # Release CI must never open a real external-provider session.
    env:
      WORDTTS_ENABLE_REAL_PROVIDER: '0'
    outputs:
      version: ${{ steps.version.outputs.version }}
      architecture: ${{ steps.mac-artifacts.outputs.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_electron.txt

      - name: Prepare isolated Python environment
        run: |
          python -m venv "$RUNNER_TEMP/wordtts-build-venv"
          echo "$RUNNER_TEMP/wordtts-build-venv/bin" >> "$GITHUB_PATH"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('requirements_electron.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 项目 engines 固定要求 Node.js 24.x。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Resolve package version
        id: version
        working-directory: electron
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.inputs.version || '' }}
        run: |
          requested="$REQUESTED_VERSION"
          if [ -z "$requested" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            requested="$GITHUB_REF_NAME"
            requested="${requested#v}"
          fi
          if [ -n "$requested" ]; then
            node ../scripts/project_version.js --set "$requested"
          else
            node ../scripts/project_version.js --sync
          fi
          resolved="$(node ../scripts/project_version.js)"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: $resolved"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt

      - name: Install Playwright browsers
        # 上面的缓存只是省时间：GitHub 会在七天无人访问后清掉缓存，
        # 而文档块图片提取要用 Chromium 渲染。缺了这一步，缓存一过期
        # 逻辑冒烟就会以“内置 Chromium 文档渲染依赖不可用”失败。
        run: python -m playwright install chromium

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build architecture-matched app and DMG
        env:
          WORDTTS_SKIP_PYTHON_DEPENDENCY_INSTALL: '1'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build_electron.sh

      - name: Resolve final macOS artifacts
        id: mac-artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch="arm64" ;;
            x86_64) arch="x64" ;;
            *) echo "不支持的 macOS 架构: $(uname -m)" >&2; exit 1 ;;
          esac
          zip_path="electron/release/小猪wordTTS-${RELEASE_VERSION}-${arch}.zip"
          dmg_path="electron/release/小猪wordTTS-${RELEASE_VERSION}-${arch}.dmg"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "最终 macOS 自动更新 ZIP: $zip_path"
          echo "最终 macOS 首次安装 DMG: $dmg_path"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-macOS
          path: |
            ${{ steps.mac-artifacts.outputs.dmg }}
            ${{ steps.mac-artifacts.outputs.zip }}
          retention-days: 30
          # Both files are already compressed release formats.
          compression-level: 0
          if-no-files-found: error
