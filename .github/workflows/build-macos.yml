name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则从 package.json 读取）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      architecture: ${{ steps.mac-artifacts.outputs.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_electron.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 项目 engines 固定要求 Node.js 24.x。
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Resolve package version
        id: version
        working-directory: electron
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          requested="$REQUESTED_VERSION"
          if [ -z "$requested" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            requested="$GITHUB_REF_NAME"
            requested="${requested#v}"
          fi
          if [ -n "$requested" ]; then
            if ! [[ "$requested" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "非法版本号: $requested" >&2
              exit 1
            fi
            current="$(node -p "require('./package.json').version")"
            if [ "$requested" != "$current" ]; then
              npm version "$requested" --no-git-tag-version
            else
              echo "package.json 版本已是 $requested，跳过 npm version"
            fi
          fi
          resolved="$(node -p "require('./package.json').version")"
          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          echo "本次构建版本: $resolved"

      - name: Validate update policy
        env:
          UPDATE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/validate_update_policy.js

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_electron.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Test Electron native file dialogs
        working-directory: electron
        run: npm test

      - name: Check workflow contracts
        working-directory: electron
        run: npm run check:contracts

      - name: Run logical workflow smoke (no page/network)
        run: python tools/xunfei_smoke.py --logical-only --source "examples/documents/信息转述及询问信息 7上- U1.docx" --max-items 100

      - name: Audit packaged runtime dependencies
        working-directory: electron
        run: npm audit --omit=dev --audit-level=high

      - name: Build architecture-matched app and DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build_electron.sh

      - name: Resolve final macOS artifacts
        id: mac-artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch="arm64" ;;
            x86_64) arch="x64" ;;
            *) echo "不支持的 macOS 架构: $(uname -m)" >&2; exit 1 ;;
          esac
          zip_path="electron/release/小猪wordTTS-${RELEASE_VERSION}-${arch}.zip"
          dmg_path="electron/release/小猪wordTTS-${RELEASE_VERSION}-${arch}.dmg"
          test -s "$zip_path"
          test -s "$dmg_path"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg_path" >> "$GITHUB_OUTPUT"
          echo "最终 macOS 自动更新 ZIP: $zip_path"
          echo "最终 macOS 首次安装 DMG: $dmg_path"

      - name: Verify packaged macOS backend (local-only)
        env:
          # Electron 的 os.tmpdir() 在 macOS 上遵循 TMPDIR；固定到 runner
          # 临时目录，失败时可以稳定上传 wordtts-electron-smoke.log。
          TMPDIR: ${{ runner.temp }}
          WORDTTS_DEBUG_LOGS: '1'
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # 这里只验证打包产物和本地后端健康接口；不打开页面，
          # 不登录讯飞、不访问第三方页面，不执行真实 Provider smoke。
          smoke_log="$TMPDIR/wordtts-electron-smoke.log"
          backend_pid=""
          cleanup() {
            if [ -n "$backend_pid" ]; then
              kill "$backend_pid" 2>/dev/null || true
              wait "$backend_pid" 2>/dev/null || true
            fi
          }
          report_failure() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ] && [ -f "$smoke_log" ]; then
              echo '--- Electron smoke diagnostic log ---' >&2
              tail -200 "$smoke_log" >&2 || true
            fi
            cleanup
            return "$exit_code"
          }
          trap report_failure EXIT

          if [ "$(uname -m)" = "arm64" ]; then
            output_dir="mac-arm64"
          else
            output_dir="mac"
          fi
          app_path="electron/release/$output_dir/小猪wordTTS.app"
          backend="$app_path/Contents/Resources/server_backend/server_backend"
          test -x "$backend"
          test -x "$app_path/Contents/MacOS/小猪wordTTS"
          file "$backend"
          file "$app_path/Contents/MacOS/小猪wordTTS"

          port="$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          token="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          WORDTTS_PORT="$port" WORDTTS_API_TOKEN="$token" WORDTTS_VERSION="${{ steps.version.outputs.version }}" "$backend" &
          backend_pid=$!
          ready=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              echo "打包后端提前退出" >&2
              exit 1
            fi
            health_json=""
            if health_json="$(curl --fail --silent --header "X-Desktop-Capability: $token" "http://127.0.0.1:$port/api/v1/health" 2>/dev/null)"; then
              if HEALTH_JSON="$health_json" python -c 'import json, os, sys; payload=json.loads(os.environ["HEALTH_JSON"]); expected=os.environ["EXPECTED_VERSION"]; ok=payload.get("status") == "ok" and payload.get("app") == "wordtts" and str(payload.get("version")) == expected; print(f"健康检查内容不匹配: {payload!r}，期望版本 {expected}", file=sys.stderr) if not ok else None; raise SystemExit(0 if ok else 1)'
              then
                ready=1
                break
              fi
            fi
            sleep 0.5
          done
          kill "$backend_pid" 2>/dev/null || true
          wait "$backend_pid" 2>/dev/null || true
          backend_pid=""
          test "$ready" -eq 1

      - name: Upload macOS smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-macOS-smoke
          path: ${{ runner.temp }}/wordtts-electron-smoke.log
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 小猪wordTTS-macOS
          path: |
            ${{ steps.mac-artifacts.outputs.dmg }}
            ${{ steps.mac-artifacts.outputs.zip }}
          retention-days: 30
          if-no-files-found: error

  # Keep only the short Release critical section serialized with Windows;
  # macOS compilation and packaging itself remains parallel with Windows.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wordtts-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install release script dependencies
        working-directory: electron
        run: npm ci --ignore-scripts

      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: 小猪wordTTS-macOS
          path: electron/release

      - name: Validate update policy
        env:
          UPDATE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate_update_policy.js

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/extract_release_notes.js

      - name: Prepare auto-update metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          UPDATE_VERSION: ${{ needs.build.outputs.version }}
          UPDATE_MAC_ARCH: ${{ needs.build.outputs.architecture }}
        run: node scripts/prepare_update_metadata.js --platform darwin

      - name: Verify release files
        run: |
          set -euo pipefail
          mac_zip="$(find electron/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          mac_dmg="$(find electron/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$mac_zip" && test -s "$mac_zip"
          test -n "$mac_dmg" && test -s "$mac_dmg"
          test -s electron/release/latest-mac.yml
          echo "macOS Release 文件校验通过: $mac_zip / $mac_dmg"

      - name: Prepare canonical GitHub asset names
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          MAC_ARCH: ${{ needs.build.outputs.architecture }}
        run: |
          set -euo pipefail
          local_zip="electron/release/小猪wordTTS-${RELEASE_VERSION}-${MAC_ARCH}.zip"
          local_dmg="electron/release/小猪wordTTS-${RELEASE_VERSION}-${MAC_ARCH}.dmg"
          github_zip="electron/release/wordTTS-${RELEASE_VERSION}-${MAC_ARCH}.zip"
          github_dmg="electron/release/wordTTS-${RELEASE_VERSION}-${MAC_ARCH}.dmg"
          test -s "$local_zip" && test -s "$local_dmg"
          cp "$local_zip" "$github_zip"
          cp "$local_dmg" "$github_dmg"
          test -s "$github_zip" && test -s "$github_dmg"
          echo "GitHub macOS 资产名: $(basename "$github_zip") / $(basename "$github_dmg")"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/release/latest-mac.yml
            electron/release/wordTTS-${{ needs.build.outputs.version }}-${{ needs.build.outputs.architecture }}.dmg
            electron/release/wordTTS-${{ needs.build.outputs.version }}-${{ needs.build.outputs.architecture }}.zip
          name: 小猪wordTTS ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          # Keep the Release invisible to electron-updater while the other
          # platform is still building or while assets are uploading.
          draft: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only after both platform assets are ready
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          releases_endpoint="repos/${GITHUB_REPOSITORY}/releases"
          release_id=""
          for lookup_attempt in $(seq 1 12); do
            # Draft Releases are intentionally invisible to the tag lookup
            # endpoint; list Releases and select the exact tag instead.
            release_id="$(gh api "$releases_endpoint" --paginate --slurp | jq -r --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag) | .id][0] // empty')"
            if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then break; fi
            if [ "$lookup_attempt" -lt 12 ]; then sleep 5; fi
          done
          if [ -z "$release_id" ]; then
            echo "未找到当前 tag 的 Draft Release: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          endpoint="repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          for attempt in $(seq 1 12); do
            names="$(gh api "$endpoint" --jq '.assets[].name')"
            if grep -Fxq "latest.yml" <<<"$names" \
              && grep -Fxq "wordTTS-Setup-${RELEASE_VERSION}-x64.exe" <<<"$names" \
              && grep -Fxq "latest-mac.yml" <<<"$names" \
              && grep -Eq "^wordTTS-${RELEASE_VERSION}-(arm64|x64|universal)\\.zip$" <<<"$names" \
              && grep -Eq "^wordTTS-${RELEASE_VERSION}-(arm64|x64|universal)\\.dmg$" <<<"$names"; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false >/dev/null
              echo "两端安装包和更新元数据已齐全，Release 已发布"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "另一平台仍在构建，Release 保持 Draft；该平台完成后会再次发布。"
